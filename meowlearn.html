<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meow Generator</title>
    <style>
        /* This prevents the page from stuttering and creates a neat box */
        body {
            font-family: monospace;
            padding: 20px;
            background-color: #f4f4f4;
        }
        #output {
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            white-space: pre-wrap;
            max-height: 75vh;   /* Keeps the box from stretching forever */
            overflow-y: auto;   /* Adds a smooth scrollbar to the box */
        }
    </style>
</head>
<body>

    <h2>Generated Meow List (500,000 Lines)</h2>
    <div id="status">Starting generation...</div>
    <br>
    <div id="output"></div>

    <script>
        const outputDiv = document.getElementById("output");
        const statusDiv = document.getElementById("status");
        
        const totalLines = 500000;
        const chunkSize = 25000; 
        let currentLine = 1;

        function generateChunks() {
            if (currentLine > totalLines) {
                statusDiv.textContent = "Done! All 500,000 lines loaded.";
                return;
            }

            let chunkContent = [];
            let end = Math.min(currentLine + chunkSize - 1, totalLines);

            statusDiv.textContent = `Loading lines ${currentLine.toLocaleString()} to ${end.toLocaleString()}...`;
            
            for (let i = currentLine; i <= end; i++) {
                chunkContent.push(`meow${i} = word`);
            }
            
            outputDiv.append(chunkContent.join("\n") + "\n");
            currentLine += chunkSize;
            setTimeout(generateChunks, 1);
        }
        generateChunks();
    </script>
</body>
</html>
