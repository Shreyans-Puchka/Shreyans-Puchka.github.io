<!DOCTYPE html>
<html>
<head>

</head>
<body>

    <h2>Generated Meow List (500,000 Lines)</h2>
    <div id="status">Starting generation...</div>
    <br>
    <div id="output"></div>

    <script>
        const outputDiv = document.getElementById("output");
        const statusDiv = document.getElementById("status");
        
        const totalLines = 500000;
        const chunkSize = 25000; // Processes 25,000 lines at a time to prevent crashing
        let currentLine = 1;

        function generateChunks() {
            if (currentLine > totalLines) {
                statusDiv.textContent = "Done! All 500,000 lines loaded.";
                return;
            }

            let chunkContent = [];
            let end = Math.min(currentLine + chunkSize - 1, totalLines);

            // Update status text
            statusDiv.textContent = `Loading lines ${currentLine.toLocaleString()} to ${end.toLocaleString()}...`;
            for (let i = currentLine; i <= end; i++) {
                chunkContent.push(`meow${i} = word`);
            }
            outputDiv.append(chunkContent.join("\n") + "\n");
            currentLine += chunkSize;
            setTimeout(generateChunks, 1);
        }
        generateChunks();
    </script>
</body>
</html>
