<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            padding: 25px;
            background-color: #1e1e1e;
            color: #ffffff;
        }
        #status {
            font-weight: bold;
            color: #ffb74d;
            margin-bottom: 20px;
        }
        #output {
            background: #2d2d2d;
            padding: 20px;
            border: 2px solid #444;
            border-radius: 5px;
            white-space: pre-wrap;
            max-height: 80vh;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="status">Initializing vocabulary core...</div>
    <pre id="output"></pre>

    <script>
        const outputDiv = document.getElementById("output");
        const statusDiv = document.getElementById("status");

        const dictionary = [
            "apple", "banana", "orange", "grape", "peach", "melon", "lemon", "mango", "berry", "cherry",
            "hello", "welcome", "classic", "prime", "alpha", "bravo", "dynamic", "matrix", "system", "network",
            "cyber", "quantum", "pixel", "logic", "vector", "cosmic", "vortex", "nebula", "galaxy", "solar",
            "planet", "comet", "meteor", "asteroid", "gravity", "orbit", "rocket", "engine", "fusion", "reactor",
            "energy", "power", "spark", "flame", "lightning", "thunder", "shadow", "storm", "blizzard", "typhoon",
            "cyclone", "tornado", "breeze", "whisper", "echo", "sound", "voice", "rhythm", "melody", "harmony",
            "canvas", "sketch", "pastel", "brush", "velvet", "silk", "satin", "cotton", "leather", "timber",
            "copper", "bronze", "silver", "golden", "platinum", "diamond", "ruby", "emerald", "sapphire", "crystal",
            "quartz", "marble", "granite", "pebble", "desert", "jungle", "forest", "tundra", "savanna", "meadow",
            "valley", "canyon", "mountain", "summit", "glacier", "island", "ocean", "stream", "river", "torrent",
            "fountain", "cascade", "autumn", "winter", "spring", "summer", "season", "climate", "weather", "warmth",
            "frosty", "chilly", "blazing", "sizzle", "frozen", "melt", "vapor", "liquid", "solid", "gas", "plasma",
            "anchor", "beacon", "compass", "portal", "tunnel", "bridge", "matrix", "vertex", "horizon", "twilight"
        ];

        const prefixes = ["sub", "trans", "hyper", "ultra", "cyber", "micro", "macro", "mega", "inter", "infra", "retro", "neo", "proto", "poly", "mono"];
        const roots = ["flex", "struct", "form", "graph", "phon", "chron", "path", "term", "log", "metr", "opt", "hydr", "aer", "geo", "pyro", "bio"];
        const suffixes = ["ic", "al", "ion", "ism", "ist", "ize", "ment", "ous", "ity", "ate", "ance", "ence", "ward", "wise", "less", "ness", "ful"];

        const totalLines = 500000;
        const chunkSize = 20000; 
        let currentLine = 1;

        function generateChunks() {
            if (currentLine > totalLines) {
                statusDiv.style.color = "#4caf50";
                statusDiv.textContent = "Done! All 500,000 distinct single words successfully loaded.";
                return;
            }

            let chunkContent = [];
            let end = Math.min(currentLine + chunkSize - 1, totalLines);

            statusDiv.textContent = `Printing entries ${currentLine.toLocaleString()} to ${end.toLocaleString()}...`;
            
            for (let i = currentLine; i <= end; i++) {
                let singleWord = "";

                if (i <= dictionary.length) {
                    singleWord = dictionary[i - 1];
                } else {
                    let seed = i - dictionary.length;
                    let pIdx = seed % prefixes.length;
                    let rIdx = Math.floor(seed / prefixes.length) % roots.length;
                    let sIdx = Math.floor(seed / (prefixes.length * roots.length)) % suffixes.length;
                    
                    singleWord = prefixes[pIdx] + roots[rIdx] + suffixes[sIdx];
                }
                
                chunkContent.push(`meow${i} = ${singleWord}`);
            }
            
            outputDiv.append(chunkContent.join("\n") + "\n");
            currentLine += chunkSize;
            
            setTimeout(generateChunks, 1);
        }
        
        generateChunks();
    </script>
</body>
</html>
