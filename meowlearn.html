<!DOCTYPE html>
<html>
<head>

</head>
<body>
<h2>Generated Meow List (500,000 Lines)</h2>
    <div id="output">Loading lines...</div>

    <script>
        // Efficiently handles 500,000 lines without crashing the browser
        let outputDiv = document.getElementById("output");
        let content = [];
        
        for (let i = 1; i <= 500000; i++) {
            content.push(`meow${i} = word`);
        }
        
        // Joins all array elements with a newline character
        outputDiv.textContent = content.join("\n");
    </script>
</body>  
</html>
